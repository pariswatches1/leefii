<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <defs>
    <linearGradient id="dl-bg-lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="240" height="80" rx="10" fill="url(#dl-bg-lg)" stroke="#15803d" stroke-width="1"/>
  <rect x="6" y="6" width="68" height="68" rx="8" fill="rgba(0,0,0,0.15)"/>
  <!-- Delivery truck icon -->
  <g fill="white" opacity="0.95">
    <!-- Truck body -->
    <rect x="12" y="24" width="32" height="24" rx="2.5"/>
    <!-- Cab -->
    <path d="M44 32h10l8 8v8H44V32z"/>
    <!-- Wheels -->
    <circle cx="24" cy="52" r="5" fill="#16a34a" stroke="white" stroke-width="2.5"/>
    <circle cx="52" cy="52" r="5" fill="#16a34a" stroke="white" stroke-width="2.5"/>
    <!-- Checkmark on truck body -->
    <path d="M21 34l4 4 7-7" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Text -->
  <text x="84" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="white" letter-spacing="0.5">LEEFII VERIFIED</text>
  <text x="84" y="52" font-family="sans-serif" font-size="17" font-weight="700" fill="white" letter-spacing="0.3">DELIVERY</text>
  <rect x="84" y="58" width="60" height="1.5" rx="0.75" fill="rgba(255,255,255,0.3)"/>
</svg>