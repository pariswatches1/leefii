    <rect x="10" y="19" width="24" height="18" rx="2"/>
    <!-- Cab -->
    <path d="M34 25h8l6 6v6H34V25z"/>
    <!-- Wheels -->
    <circle cx="19" cy="40" r="4" fill="#16a34a" stroke="white" stroke-width="2"/>
    <circle cx="40" cy="40" r="4" fill="#16a34a" stroke="white" stroke-width="2"/>
    <!-- Checkmark on truck body -->
    <path d="M17 27l3 3 5.5-5.5" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Text -->
  <text x="64" y="24" font-family="sans-serif" font-size="10" font-weight="700" fill="white" letter-spacing="0.5">LEEFII VERIFIED</text>
  <text x="64" y="42" font-family="sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="0.3">DELIVERY</text>
  <rect x="64" y="47" width="46" height="1" rx="0.5" fill="rgba(255,255,255,0.3)"/>
</svg>