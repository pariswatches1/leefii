<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" width="180" height="60">
  <defs>
    <linearGradient id="dl-bg-md" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="180" height="60" rx="8" fill="url(#dl-bg-md)" stroke="#15803d" stroke-width="1"/>
  <rect x="4" y="4" width="52" height="52" rx="6" fill="rgba(0,0,0,0.15)"/>
  <!-- Delivery truck icon -->
  <g fill="white" opacity="0.95">
