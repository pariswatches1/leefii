<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="dl-bg-sm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="120" height="40" rx="6" fill="url(#dl-bg-sm)" stroke="#15803d" stroke-width="1"/>
  <rect x="2" y="2" width="36" height="36" rx="5" fill="rgba(0,0,0,0.15)"/>
  <!-- Delivery truck icon -->
  <g fill="white" opacity="0.95">
    <!-- Truck body -->
    <rect x="8" y="14" width="16" height="12" rx="1.5"/>
    <!-- Cab -->
    <path d="M24 18h5l4 4v4h-9v-8z"/>
    <!-- Wheels -->
    <circle cx="14" cy="28" r="2.5" fill="#16a34a" stroke="white" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="2.5" fill="#16a34a" stroke="white" stroke-width="1.5"/>
    <!-- Checkmark on truck body -->
    <path d="M13 19l2 2 3.5-3.5" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Text -->
  <text x="42" y="16" font-family="sans-serif" font-size="7" font-weight="700" fill="white" letter-spacing="0.3">LEEFII VERIFIED</text>
  <text x="42" y="28" font-family="sans-serif" font-size="8" font-weight="700" fill="white" letter-spacing="0.2">DELIVERY</text>
</svg>